name: KustMusic Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ASSISTANT_SESSION: ${{ secrets.ASSISTANT_SESSION }}
      OWNER_ID: ${{ secrets.OWNER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Check versions
        run: |
          python --version
          ffmpeg -version
          deno --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test YouTube Search API
        run: |
          python - <<'PY'
          import requests

          url = "https://search-api.kustbotsweb.workers.dev/search?q=shape%20of%20you"

          try:
              r = requests.get(url, timeout=20)
              print("STATUS:", r.status_code)
              print("CONTENT-TYPE:", r.headers.get("content-type"))
              print("RESPONSE:")
              print(r.text[:3000])
              r.raise_for_status()
          except Exception as e:
              print("SEARCH API ERROR:", repr(e))
              raise
          PY

      - name: Start KustMusic
        run: |
          python main.py