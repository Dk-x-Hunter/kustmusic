name: KustMusic Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ASSISTANT_SESSION: ${{ secrets.ASSISTANT_SESSION }}
      OWNER_ID: ${{ secrets.OWNER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp requests

      - name: Check installed tools
        run: |
          echo "=== Python ==="
          python --version

          echo "=== yt-dlp ==="
          yt-dlp --version

          echo "=== FFmpeg ==="
          ffmpeg -version | head -n 1

          echo "=== Deno ==="
          deno --version

      - name: Test YouTube Search API
        run: |
          python - <<'PY'
          import requests

          url = "https://search-api.kustbotsweb.workers.dev/search?q=shape%20of%20you"

          print("Testing:", url)

          try:
              r = requests.get(url, timeout=20)

              print("STATUS:", r.status_code)
              print("CONTENT-TYPE:", r.headers.get("content-type"))
              print("RESPONSE:")
              print(r.text[:3000])

              r.raise_for_status()

          except Exception as e:
              print("SEARCH API ERROR:", repr(e))
              raise
          PY

      - name: Test YouTube Extraction
        run: |
          yt-dlp \
            --extractor-args "youtube:player_client=android,mweb,web" \
            -f "bestaudio/best" \
            --no-playlist \
            --no-warnings \
            --verbose \
            "ytsearch1:Shape of You Ed Sheeran"

      - name: Start KustMusic
        run: |
          python main.py